<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Wandeltijd</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e2a3b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Eén lichte kolom, altijd leesbaar buiten. Grote knoppen voor koude handen. Onderbalk zoals in Eten onderweg. */
:root{
  --bg:#f4f1ea; --card:#ffffff; --fg:#1d2a33; --muted:#5d6a72; --line:#ddd8cc;
  --acc:#0f6e56; --acc-soft:#e1f2ea; --navy:#0e2a3b;
  --warn:#9a4f00; --warn-soft:#fff1e0; --bad:#b42323; --bad-soft:#fde8e8; --ok:#1d7a3a; --ok-soft:#e3f5e8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
header.top{background:var(--bg);padding:18px 16px 10px;border-bottom:1px solid var(--line)}
header.top h1{margin:0;font-size:28px;line-height:1.1}
header.top p{margin:4px 0 0;color:var(--muted);font-size:16px}
main{max-width:560px;margin:0 auto;padding:14px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:19px}
.sec{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
.row label{color:var(--muted);font-size:16px}
.row input{width:120px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fbfaf7;color:var(--fg);font-size:17px;text-align:right}
.row input[type=time]{width:130px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;border:0;background:var(--acc);color:#fff;font-size:19px;font-weight:600;margin-top:10px;cursor:pointer}
.btn.big{padding:22px;font-size:22px}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:500;font-size:17px}
.btn.warn{background:var(--warn)}
.btn.navy{background:var(--navy)}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns2 .btn{margin-top:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.big-num{font-size:34px;font-weight:700;line-height:1.1}
.sub{color:var(--muted);font-size:15px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:600;background:var(--acc-soft);color:var(--acc)}
.alert{border-radius:12px;padding:10px 12px;margin:10px 0 0;font-size:16px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--acc-soft);color:var(--acc)}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;align-items:baseline}
.cmp .h{font-size:14px;color:var(--muted);font-weight:600}
.cmp .v{font-weight:600;text-align:right}
.step{padding:8px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .k{color:var(--muted);font-size:15px}
.step .v{font-size:17px}
.tot{background:var(--acc-soft);color:var(--acc);border-radius:12px;padding:12px;margin-top:10px}
.tot .big{font-size:26px;font-weight:700}
.day{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .d{font-weight:600}
.day .r{text-align:right;font-weight:600}
.day .s{color:var(--muted);font-size:15px}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:8px}
.bars div{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px}
.bars div.rest{background:var(--line)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
.tabs button.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc);font-weight:600}
.fb{font-size:15px;margin-top:2px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.tm{display:flex;gap:6px;align-items:center}
.tm input{width:62px}
.tm span{color:var(--muted);font-size:15px}
.hide{display:none!important}
.note{color:var(--muted);font-size:15px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.bottom button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.bottom button span{font-size:24px;line-height:1.2}
nav.bottom button.on{color:var(--acc);font-weight:700}
.toast{position:fixed;left:16px;right:16px;bottom:86px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-size:16px;z-index:20}
details summary{cursor:pointer;color:var(--muted);font-size:16px;padding:6px 0}
</style>
</head>
<body>
<header class="top"><h1 id="hTitle">Vandaag</h1><p id="hSub"></p></header>
<main id="out"></main>
<nav class="bottom" id="nav">
  <button data-v="vandaag" class="on"><span>🥾</span>Vandaag</button>
  <button data-v="plan"><span>🗺️</span>Plan</button>
  <button data-v="logboek"><span>📒</span>Logboek</button>
  <button data-v="oefenen"><span>🧮</span>Oefenen</button>
  <button data-v="meer"><span>⚙️</span>Meer</button>
</nav>
<div id="toast" class="toast hide"></div>

<script>
/* ===================== Opslag ===================== */
const KEY = "wandeltijd-v1";
const DEF_SET = {tempo:3, stijg:300, daal:500, leren:true, start:"2026-11-05", fase1:15, fase1dagen:21, lat:null, lon:null, locTijd:null};
let S = {set:{...DEF_SET}, days:{}};
function load(){ try{ const j=JSON.parse(localStorage.getItem(KEY)||"null"); if(j&&j.days){ S={set:{...DEF_SET,...j.set},days:j.days}; } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Opslaan mislukt op dit toestel."); } }
load();

/* ===================== Hulpjes ===================== */
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function pad(n){return String(n).padStart(2,"0");}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return dkey(new Date());}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return dkey(d);}
function fromKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);}
const DAGEN=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const MAANDEN=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
function longDate(k){const d=fromKey(k);return DAGEN[d.getDay()]+" "+d.getDate()+" "+MAANDEN[d.getMonth()];}
function shortDate(k){const d=fromKey(k);return DAGEN[d.getDay()].slice(0,2)+" "+d.getDate()+"/"+(d.getMonth()+1);}
function dur(min){ if(min==null||isNaN(min)) return "–"; const neg=min<0; min=Math.round(Math.abs(min)); return (neg?"−":"")+Math.floor(min/60)+" u "+pad(min%60); }
function diff(min){ min=Math.round(min); if(min===0) return "op tijd"; return (min>0?"+":"−")+dur(Math.abs(min)).replace(/^0 u /,"")+(Math.abs(min)<60?" min":""); }
function clock(ts){const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes());}
function hmToMin(s){ if(!s) return null; const [h,m]=s.split(":").map(Number); return h*60+m; }
function minToHm(m){ m=((Math.round(m)%1440)+1440)%1440; return pad(Math.floor(m/60))+":"+pad(m%60); }
function num(v){ if(v==null) return NaN; return parseFloat(String(v).trim().replace(",",".")); }
function dec(x,d){return Number(x).toLocaleString("nl-BE",{minimumFractionDigits:d,maximumFractionDigits:d});}
function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("hide");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.add("hide"),3500);}

/* ===================== Rekenregel (Duitse Alpenvereniging) ===================== */
/* Tijd afstand = km / tempo. Tijd hoogte = stijgen/stijgsnelheid + dalen/daalsnelheid.
   Looptijd = grootste volledig + helft van de kleinste. */
function regel(km, up, down, tempo, stijg, daal){
  const tA = km / tempo * 60;
  const tH = up / stijg * 60 + down / daal * 60;
  const groot = Math.max(tA,tH), klein = Math.min(tA,tH);
  return {tA, tH, groot, klein, loop: groot + klein/2, afstandGrootst: tA>=tH};
}

/* ===================== Geleerd tempo ===================== */
/* Per gelopen dag: echte looptijd (zonder pauzes) gedeeld door de looptijd volgens de vuistregel.
   Factor 1,20 = je loopt 20% langer dan de regel voorspelt. Mediaan van de laatste 7 gelopen dagen, vanaf 3 dagen. */
function dagFactor(day){
  if(!day||!day.plan||!day.real||!day.real.end) return null;
  const r = regel(day.plan.km, day.plan.up, day.plan.down, day.plan.basis.tempo, day.plan.basis.stijg, day.plan.basis.daal);
  const loop = echteLooptijd(day);
  if(!r.loop || loop==null || loop<=0) return null;
  return loop / r.loop;
}
function geleerd(){
  const f = Object.keys(S.days).sort().map(k=>dagFactor(S.days[k])).filter(x=>x!=null).slice(-7);
  if(f.length<3) return {factor:null, n:f.length};
  const s=[...f].sort((a,b)=>a-b), m=Math.floor(s.length/2);
  const med = s.length%2 ? s[m] : (s[m-1]+s[m])/2;
  return {factor:med, n:f.length};
}

/* ===================== Echte tijden ===================== */
function pauzeMin(day, nu){
  if(!day.real||!day.real.pauzes) return 0;
  return day.real.pauzes.reduce((t,p)=>t+((p.e||nu||Date.now())-p.s)/60000,0);
}
function echteLooptijd(day){
  if(!day.real||!day.real.start||!day.real.end) return null;
  return (day.real.end-day.real.start)/60000 - pauzeMin(day, day.real.end);
}
function inPauze(day){ const p=day.real&&day.real.pauzes; return !!(p&&p.length&&!p[p.length-1].e); }

/* ===================== Plan maken ===================== */
function maakPlan(km, up, down, pauze, vertrek){
  const b = {tempo:S.set.tempo, stijg:S.set.stijg, daal:S.set.daal};
  const r = regel(km, up, down, b.tempo, b.stijg, b.daal);
  const g = geleerd();
  const factor = (S.set.leren && g.factor) ? g.factor : 1;
  const loop = r.loop * factor;
  const v = hmToMin(vertrek);
  return {km, up, down, pauze, vertrek, basis:b, regelLoop:r.loop, factor, loop, totaal: loop+pauze, aankomst: v==null?null:v+loop+pauze};
}

/* ===================== Zon (NOAA-berekening, werkt offline) ===================== */
function zonTijden(dateKey, lat, lon){
  /* Volledige NOAA-zonneberekening (Julian century), resultaat in de tijdzone van de telefoon. */
  if(lat==null||lon==null) return null;
  const d=fromKey(dateKey), rad=Math.PI/180, deg=180/Math.PI;
  function moment(zenit, onder){
    let utcMin=720-4*lon;
    for(let i=0;i<3;i++){
      const jd=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0)/86400000+2440587.5+utcMin/1440;
      const T=(jd-2451545)/36525;
      const L0=(280.46646+T*(36000.76983+T*0.0003032))%360;
      const M=357.52911+T*(35999.05029-0.0001537*T);
      const ecc=0.016708634-T*(0.000042037+0.0000001267*T);
      const C=Math.sin(M*rad)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*M*rad)*(0.019993-0.000101*T)+Math.sin(3*M*rad)*0.000289;
      const lam=L0+C-0.00569-0.00478*Math.sin((125.04-1934.136*T)*rad);
      const eps0=23+(26+((21.448-T*(46.815+T*(0.00059-T*0.001813))))/60)/60;
      const eps=eps0+0.00256*Math.cos((125.04-1934.136*T)*rad);
      const decl=Math.asin(Math.sin(eps*rad)*Math.sin(lam*rad));
      const y=Math.tan(eps/2*rad)**2;
      const eqt=4*deg*(y*Math.sin(2*L0*rad)-2*ecc*Math.sin(M*rad)+4*ecc*y*Math.sin(M*rad)*Math.cos(2*L0*rad)-0.5*y*y*Math.sin(4*L0*rad)-1.25*ecc*ecc*Math.sin(2*M*rad));
      const c=Math.cos(zenit*rad)/(Math.cos(lat*rad)*Math.cos(decl))-Math.tan(lat*rad)*Math.tan(decl);
      if(c<-1||c>1) return null;
      const ha=Math.acos(c)*deg;
      utcMin=720-4*lon-eqt+(onder?4*ha:-4*ha);
    }
    const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0)+utcMin*60000);
    return t.getHours()*60+t.getMinutes()+t.getSeconds()/60;
  }
  return {op: moment(90.833,false), onder: moment(90.833,true), donker: moment(96,true)};
}
function haalLocatie(cb){
  if(!navigator.geolocation){ toast("Locatie is niet beschikbaar op dit toestel."); cb&&cb(false); return; }
  toast("Locatie zoeken via gps…");
  navigator.geolocation.getCurrentPosition(p=>{
    S.set.lat=p.coords.latitude; S.set.lon=p.coords.longitude; S.set.locTijd=Date.now(); save();
    toast("Locatie bewaard."); cb&&cb(true);
  }, ()=>{ toast("Geen gps-fix. De laatst bewaarde locatie blijft gelden."); cb&&cb(false); }, {enableHighAccuracy:true, timeout:20000, maximumAge:600000});
}

/* ===================== Fase-regel ===================== */
function dagNummer(k){ return Math.floor((fromKey(k)-fromKey(S.set.start))/86400000)+1; }
function faseInfo(k, km){
  const n = dagNummer(k);
  if(n<1) return null;
  if(n<=S.set.fase1dagen && km>S.set.fase1) return {cls:"warn", t:`Dag ${n} van de inloopfase: je plant ${dec(km,1)} km. Je eigen regel is maximaal ${S.set.fase1} km per dag in de eerste ${S.set.fase1dagen} dagen.`};
  if(n<=S.set.fase1dagen) return {cls:"ok", t:`Dag ${n} van de inloopfase (max ${S.set.fase1} km).`};
  return {cls:"info", t:`Dag ${n}: opbouwfase naar 20 km per dag.`};
}

/* ===================== Weergaven ===================== */
let view = "vandaag", planDag = null, oefTab = "r";
function setView(v){ view=v; document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); render(); window.scrollTo(0,0); }
document.querySelectorAll("nav.bottom button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.v)));

function render(){
  const titles={vandaag:["Vandaag",longDate(today())],plan:["Plan",""],logboek:["Logboek","Plan en realiteit"],oefenen:["Looptijd berekenen","Rekenen en oefenen"],meer:["Meer","Instellingen en back-up"]};
  $("hTitle").textContent=titles[view][0]; $("hSub").textContent=titles[view][1];
  ({vandaag:rVandaag,plan:rPlan,logboek:rLogboek,oefenen:rOefenen,meer:rMeer})[view]();
}

/* ---------- Vandaag ---------- */
function rVandaag(){
  const k=today(), day=S.days[k];
  let h="";
  if(!day||(!day.plan&&!day.rust)){
    h+=`<div class="card"><h2>Nog geen plan voor vandaag</h2><p class="sub">Vul afstand en hoogtemeters in uit Mapy, dan zie je je looptijd en aankomstuur.</p>
      <button class="btn" id="goPlan">Plan maken</button>
      <button class="btn alt" id="rustBtn">Vandaag is een rustdag</button></div>`;
    $("out").innerHTML=h;
    $("goPlan").onclick=()=>{planDag=k;setView("plan");};
    $("rustBtn").onclick=()=>{S.days[k]={rust:true};save();render();};
    return;
  }
  if(day.rust){
    $("out").innerHTML=`<div class="card"><h2>Rustdag</h2><p class="sub">Herstel, schrijven, batterijen laden. Ook dat hoort bij de tocht.</p>
      <button class="btn alt" id="undoRust">Toch wandelen vandaag</button></div>`;
    $("undoRust").onclick=()=>{delete S.days[k];save();render();};
    return;
  }
  const p=day.plan, r=day.real||{};
  h+=`<div class="card"><div class="sub">Plan</div>
    <div class="big-num">${dec(p.km,1)} km</div>
    <div class="sub">↑ ${p.up} m · ↓ ${p.down} m · looptijd ${dur(p.loop)} + pauzes ${dur(p.pauze)}</div>
    ${p.aankomst!=null?`<div style="margin-top:8px">Vertrek <b>${p.vertrek}</b> → aankomst <b>${minToHm(p.aankomst)}</b></div>`:""}
    ${zonAlert(k,p.aankomst)}
  </div>`;
  if(!r.start){
    h+=`<button class="btn big" id="bStart">▶ Start wandeling</button>`;
  } else if(!r.end){
    const nu=Date.now(), pz=pauzeMin(day,nu), loop=(nu-r.start)/60000-pz, paused=inPauze(day);
    const sd=new Date(r.start), startMin=sd.getHours()*60+sd.getMinutes();
    const aankomstNu = startMin + p.loop + Math.max(pz, p.pauze);
    h+=`<div class="card"><div class="sub">${paused?"Pauze":"Onderweg"} sinds ${clock(paused?r.pauzes[r.pauzes.length-1].s:r.start)}</div>
      <dl class="kv" style="margin-top:8px">
        <dt>Gestart</dt><dd>${clock(r.start)}</dd>
        <dt>Gelopen (zonder pauzes)</dt><dd>${dur(loop)}</dd>
        <dt>Pauzes tot nu</dt><dd>${dur(pz)}</dd>
        <dt>Geplande looptijd</dt><dd>${dur(p.loop)}</dd>
        <dt>Verwachte aankomst</dt><dd>${minToHm(aankomstNu)}</dd>
      </dl>${zonAlert(k,aankomstNu)}</div>
      <div class="btns2"><button class="btn ${paused?"":"warn"}" id="bPauze">${paused?"▶ Verder":"⏸ Pauze"}</button>
      <button class="btn navy" id="bEind">🏁 Aangekomen</button></div>`;
  } else {
    h+=vergelijkCard(k,day);
  }
  h+=`<details style="margin-top:14px"><summary>Plan of tijden aanpassen</summary>
      <button class="btn alt" id="bEditPlan">Plan aanpassen</button>
      ${r.start?`<button class="btn alt" id="bEditTijd">Tijden corrigeren</button>`:""}
      <button class="btn alt" id="bWis">Dag wissen</button></details>`;
  $("out").innerHTML=h;
  if($("bStart")) $("bStart").onclick=()=>{day.real={start:Date.now(),pauzes:[]};save();render();toast("Goede tocht.");};
  if($("bPauze")) $("bPauze").onclick=()=>{ if(inPauze(day)) day.real.pauzes[day.real.pauzes.length-1].e=Date.now(); else day.real.pauzes.push({s:Date.now()}); save(); render(); };
  if($("bEind")) $("bEind").onclick=()=>{ if(!confirm("Aangekomen? De tijd stopt.")) return; if(inPauze(day)) day.real.pauzes[day.real.pauzes.length-1].e=Date.now(); day.real.end=Date.now(); save(); render(); };
  $("bEditPlan").onclick=()=>{planDag=k;setView("plan");};
  if($("bEditTijd")) $("bEditTijd").onclick=()=>tijdenCorrigeren(k);
  $("bWis").onclick=()=>{ if(confirm("Deze dag volledig wissen?")){ delete S.days[k]; save(); render(); } };
}
function zonAlert(k, aankomst){
  if(aankomst==null) return "";
  const z=zonTijden(k,S.set.lat,S.set.lon);
  if(!z||z.onder==null) return `<div class="alert info">Zonsondergang onbekend: bewaar je locatie onder Plan.</div>`;
  const rest=z.onder-aankomst;
  const zt=`zon onder ${minToHm(z.onder)} · donker ${minToHm(z.donker)}`;
  if(aankomst>z.donker) return `<div class="alert bad">Aankomst na het donker (${zt}). Vroeger vertrekken of korter plannen.</div>`;
  if(aankomst>z.onder) return `<div class="alert bad">Aankomst na zonsondergang (${zt}). Hoofdlamp klaar.</div>`;
  if(rest<60) return `<div class="alert warn">Krap: ${Math.round(rest)} min voor zonsondergang (${zt}).</div>`;
  return `<div class="alert ok">Ruim voor zonsondergang (${zt}).</div>`;
}
function vergelijkCard(k,day){
  const p=day.plan, r=day.real, pz=pauzeMin(day,r.end), loop=echteLooptijd(day);
  const sd=new Date(r.start), startMin=sd.getHours()*60+sd.getMinutes();
  const ed=new Date(r.end), endMin=ed.getHours()*60+ed.getMinutes();
  const f=dagFactor(day);
  return `<div class="card"><h2>Plan en realiteit</h2>
    <div class="cmp">
      <span></span><span class="h" style="text-align:right">Plan</span><span class="h" style="text-align:right">Echt</span>

function tijdenCorrigeren(k){
  const day=S.days[k], r=day.real;
  const sd=new Date(r.start);
  const st=prompt("Starttijd (uu:mm)", clock(r.start)); if(st===null) return;
  const sm=hmToMin(st); if(sm==null||isNaN(sm)){toast("Tijd niet herkend.");return;}
  const base=new Date(sd.getFullYear(),sd.getMonth(),sd.getDate()).getTime();
  r.start=base+sm*60000;
  if(r.end){
    const et=prompt("Aankomsttijd (uu:mm)", clock(r.end)); if(et===null){save();render();return;}
    const em=hmToMin(et); if(em!=null&&!isNaN(em)) r.end=base+em*60000;
    const pt=prompt("Totale pauzetijd in minuten", Math.round(pauzeMin(day,r.end)));
    if(pt!==null&&!isNaN(num(pt))) r.pauzes=[{s:r.start,e:r.start+num(pt)*60000}];
  }
  save(); render(); toast("Tijden aangepast.");
}

/* ---------- Logboek ---------- */
function rLogboek(){
  const keys=Object.keys(S.days).sort();
  const gelopen=keys.filter(k=>S.days[k].real&&S.days[k].real.end);
  const rust=keys.filter(k=>S.days[k].rust);
  const kmTot=gelopen.reduce((t,k)=>t+S.days[k].plan.km,0);
  const g=geleerd();
  let h=`<div class="card"><h2>Overzicht</h2><dl class="kv">
    <dt>Gelopen kilometers</dt><dd>${dec(kmTot,1)} km</dd>
    <dt>Wandeldagen</dt><dd>${gelopen.length}</dd>
    <dt>Rustdagen</dt><dd>${rust.length}</dd>
    <dt>Gemiddeld per wandeldag</dt><dd>${gelopen.length?dec(kmTot/gelopen.length,1)+" km":"–"}</dd>
  </dl>`;
  const laatste=keys.filter(k=>S.days[k].rust||(S.days[k].real&&S.days[k].real.end)).slice(-21);
  if(laatste.length){
    const max=Math.max(...laatste.map(k=>S.days[k].plan?S.days[k].plan.km:0),1);
    h+=`<div class="sub" style="margin-top:12px">Kilometers per dag (laatste ${laatste.length})</div><div class="bars">${laatste.map(k=>S.days[k].rust?`<div class="rest" title="rust" style="height:6%"></div>`:`<div style="height:${S.days[k].plan.km/max*100}%"></div>`).join("")}</div>`;
  }
  h+=`</div>`;
  h+=`<div class="card"><h2>Jouw tempo</h2>`;
  if(g.factor){
    const vlak=S.set.tempo/g.factor;
    h+=`<div class="big-num">× ${dec(g.factor,2)}</div>
      <p class="sub">Je loopt ${g.factor>=1?dec((g.factor-1)*100,0)+"% trager":dec((1-g.factor)*100,0)+"% sneller"} dan de vuistregel met ${dec(S.set.tempo,1)} km/u (mediaan van ${g.n} dagen). Omgerekend loop je op vlak terrein ${dec(vlak,1)} km/u.</p>`;
    const fs=gelopen.map(k=>dagFactor(S.days[k])).filter(x=>x!=null);
    if(fs.length>=6){
      const half=Math.floor(fs.length/2), a=fs.slice(0,half), b=fs.slice(half);
      const ma=a.reduce((x,y)=>x+y,0)/a.length, mb=b.reduce((x,y)=>x+y,0)/b.length;
      h+=`<div class="alert ${mb<ma?"ok":"info"}">${mb<ma?"Je wordt sneller: je conditie groeit.":"Je tempo blijft gelijk of daalt licht. Let op herstel en rustdagen."}</div>`;
    }
  } else h+=`<p class="sub">Na 3 gelopen dagen berekent de app hier je eigen tempo. Nu: ${g.n} ${g.n===1?"dag":"dagen"}.</p>`;
  h+=`</div><div class="sec">Dagen</div><div class="card">`;
  const lijst=keys.slice().reverse().filter(k=>S.days[k].rust||S.days[k].plan);
  if(!lijst.length) h+=`<p class="sub">Nog niets. Begin bij Plan.</p>`;
  lijst.forEach(k=>{
    const d=S.days[k];
    if(d.rust){ h+=`<div class="day"><span class="d">${shortDate(k)}</span><span class="r">rust</span></div>`; return; }
    const loop=echteLooptijd(d);
    h+=`<div class="day"><span class="d">${shortDate(k)} · ${dec(d.plan.km,1)} km</span><span class="r">${loop!=null?diff(loop-d.plan.loop):(d.real&&d.real.start?"onderweg":"gepland")}</span>
      <span class="s">↑ ${d.plan.up} ↓ ${d.plan.down} · plan ${dur(d.plan.loop)}${loop!=null?" · echt "+dur(loop):""}</span><span></span></div>`;
  });
  h+=`</div>`;
  $("out").innerHTML=h;
}

let opg=null, score={goed:0,tot:0};
function nieuweOpgave(){
  const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const eq=ri(0,1)?10:20;
  const seg=[]; const n=ri(2,4); let dir=1;
  for(let i=0;i<n;i++){ seg.push({dir, lijnen:ri(3,25)}); dir=-dir; }
  if(ri(0,1)) seg.forEach(s=>s.dir=-s.dir);
  const up=seg.filter(s=>s.dir>0).reduce((t,s)=>t+s.lijnen*eq,0);
  const dn=seg.filter(s=>s.dir<0).reduce((t,s)=>t+s.lijnen*eq,0);
  const km=ri(8,44)/2, tempo=[2.5,3,3.5,4][ri(0,3)];
  const r=regel(km,up,dn,tempo,300,500);
  opg={eq,seg,km,tempo,up,dn,tA:r.tA,tH:r.tH,tot:r.loop,r};
}

      <div class="step"><div class="k">Tijd afstand: ${dec(o.km,1)} ÷ ${dec(o.tempo,1)}</div><div class="v">${dur(o.tA)}</div></div>

async function backup(){
  const naam="wandeltijd-backup-"+today()+".json";
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const file=new File([blob],naam,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:naam}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=naam; a.click(); toast("Back-up gedownload: "+naam);
}

/* ===================== Start ===================== */
render();
setInterval(()=>{ if(view==="vandaag"){ const d=S.days[today()]; if(d&&d.real&&d.real.start&&!d.real.end) render(); } },30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) render(); });
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  let herladen=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(herladen) return; herladen=true; location.reload(); });
}
</script>
